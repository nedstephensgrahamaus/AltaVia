<style>
:root{
  --rock:#E9ECEE; --paper:#FFFFFF; --ink:#1E2A32; --muted:#5B6770; --line:#C9D0D5;
  --av1:#1F4E8C;
  --open:#1F5FAF; --wait:#B7790A; --full:#B3261E; --unknown:#7A858E; --booked:#2E7D4F;
  --head:'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif;
  --body:'Atkinson Hyperlegible', Verdana, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--rock);color:var(--ink);font:17px/1.55 var(--body)}
header{padding:20px 20px 14px;max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-end;justify-content:space-between}
.title{display:flex;align-items:center;gap:14px}
.tri{width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:38px solid var(--av1);position:relative;flex:none}
.tri span{position:absolute;left:-6px;top:13px;color:#fff;font:700 20px/1 var(--head)}
h1{font:700 clamp(26px,4vw,36px)/1.05 var(--head);margin:0;letter-spacing:.2px}
.sub{color:var(--muted);margin:2px 0 0}
.stamp{font-size:15px;color:var(--muted);text-align:right}
.stamp strong{color:var(--ink)}
.notice{max-width:1100px;margin:0 auto 12px;padding:0 20px}
.notice p{margin:0;background:#FFF6E0;border-left:5px solid var(--wait);padding:10px 14px;font-size:15px}
#map{height:62vh;min-height:360px;max-width:1100px;margin:0 auto;border-top:3px solid var(--av1);border-bottom:3px solid var(--av1)}
@media(min-width:1140px){#map{border:3px solid var(--av1);border-radius:6px}}
.legend{max-width:1100px;margin:12px auto 0;padding:0 20px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.dot.hollow{background:#fff!important;border:3px solid var(--unknown);box-shadow:none}
main{max-width:1100px;margin:0 auto;padding:18px 20px 40px}
h2{font:700 24px/1.2 var(--head);margin:10px 0 12px}
ol.nights{list-style:none;margin:0 0 0 18px;padding:0}
ol.nights li{position:relative;padding:0 0 18px 28px;border-left:4px solid transparent}
.num{position:absolute;left:-20px;top:0;width:36px;height:36px;border-radius:50%;color:#fff;font:700 18px/32px var(--head);text-align:center;border:2px solid #fff}
.row{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;display:block}
.row:hover{border-color:var(--av1)}
.row:focus-visible{outline:3px solid var(--av1);outline-offset:2px}
.date{font:600 16px/1.2 var(--head);color:var(--muted)}
.hut{font:700 21px/1.25 var(--head);margin:2px 0 4px}
.pill{display:inline-block;color:#fff;font-size:14px;font-weight:700;padding:2px 10px;border-radius:12px;vertical-align:2px}
.meta{font-size:15px;color:var(--muted);margin-top:4px}
.exit .num{background:var(--muted)!important}
footer{max-width:1100px;margin:0 auto;padding:0 20px 30px;font-size:14px;color:var(--muted)}
/* map markers */
.mk{width:34px;height:34px;border-radius:50%;color:#fff;font:700 17px/30px var(--head);text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.mk.alt{width:18px;height:18px;background:#fff!important;border-width:3px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tilewarn{position:absolute;z-index:1000;left:12px;right:12px;bottom:28px;max-width:560px;background:#FFF6E0;border-left:5px solid var(--wait);padding:10px 14px;font:15px/1.45 var(--body);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.leaflet-control-layers{font:15px/1.5 var(--body)}
.leaflet-popup-content{font:15px/1.5 var(--body);margin:14px 16px;min-width:230px}
.pp h3{font:700 20px/1.2 var(--head);margin:0 0 2px}
.pp dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.pp dt{color:var(--muted)} .pp dd{margin:0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

(function(){
  var D = JSON.parse(document.getElementById('data').textContent);

    LIMITED:{label:'Few beds left',c:'var(--wait)',hex:'#B7790A'},
    NOT_YET_OPEN:{label:'Bookings not open yet',c:'var(--wait)',hex:'#B7790A'},
    FULL:{label:'Full for your night',c:'var(--full)',hex:'#B3261E'},
    CLOSED:{label:'Closed',c:'var(--full)',hex:'#B3261E'},
    UNKNOWN:{label:'Status unknown',c:'var(--unknown)',hex:'#7A858E'},
    BOOKED:{label:'Booked',c:'var(--booked)',hex:'#2E7D4F'}
  };
  function st(k){return S[k]||S.UNKNOWN;}
  function walk(w){return 'to '+esc(w.to)+', '+w.km+' km, up '+w.up.toLocaleString()+' m, down '+w.down.toLocaleString()+' m';}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  // Booking status arrives only in the link's #fragment, which browsers never send to the web server.
  var CODES = {B:'BOOKED',O:'OPEN',L:'LIMITED',N:'NOT_YET_OPEN',F:'FULL',C:'CLOSED',U:'UNKNOWN'};
  var H = {};
  location.hash.replace(/^#/,'').split('&').forEach(function(p){ var kv=p.split('='); if(kv[0]) H[kv[0]] = decodeURIComponent(kv[1]||''); });
  var hasStatus = !!H.s;
  var ns = (H.s||'').toUpperCase(), bs = (H.b||'').toUpperCase();
  D.nights.forEach(function(x,i){ x.status = CODES[ns.charAt(i)] || 'UNKNOWN'; });
  Object.keys(D.backups).forEach(function(k,i){ D.backups[k].status = CODES[bs.charAt(i)] || 'UNKNOWN'; });
  window.addEventListener('hashchange', function(){ location.reload(); });

  var stamp = document.getElementById('stamp');
  var n = document.getElementById('notice');
  if (hasStatus) {
    stamp.innerHTML = 'Booking status as of<br><strong>'+esc(H.d||'the latest email')+'</strong>';
    n.parentNode.remove();
  } else {
    stamp.textContent = '';
    n.textContent = 'Booking status is not shown on this page by itself. Open the map from the link in the daily email to see it.';
  }

  // legend
  var lg = document.getElementById('legend');
  ['BOOKED','OPEN','NOT_YET_OPEN','FULL','UNKNOWN'].forEach(function(k){
    lg.insertAdjacentHTML('beforeend','<span><i class="dot" style="background:'+st(k).c+'"></i>'+st(k).label+'</span>');
  });
  lg.insertAdjacentHTML('beforeend','<span><i class="dot hollow"></i>Backup refugio</span>');
  lg.insertAdjacentHTML('beforeend','<span><i style="display:inline-block;width:26px;height:8px;background:#fff;border:2px solid #1E2A32;border-radius:3px"></i>Route</span>');

  // map
  var map = L.map('map',{scrollWheelZoom:false});
  var imagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'});
  var places = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:18});
  var satellite = L.layerGroup([imagery, places]);
  var topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'Map data &copy; OpenStreetMap contributors, SRTM | Style &copy; OpenTopoMap (CC-BY-SA)'});
  var street = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Map &copy; Esri, HERE, Garmin, OpenStreetMap contributors'});
  satellite.addTo(map);
  L.control.layers({'Satellite':satellite,'Walking map':topo,'Street map':street},null,{collapsed:false,position:'topright'}).addTo(map);
  L.control.scale({imperial:false}).addTo(map);
  var tilesLoaded = 0;
  [imagery, topo, street].forEach(function(l){ l.on('tileload', function(){ tilesLoaded++; var m=document.getElementById('tilewarn'); if(m) m.remove(); }); });
  setTimeout(function(){
    if (tilesLoaded) return;
    var m = document.createElement('div'); m.id='tilewarn'; m.className='tilewarn';
    m.innerHTML = '<strong>The map background could not load.</strong> The route and huts still work, but the satellite and walking maps need an internet connection and a normal web browser. If you are viewing this inside another app (such as an email or chat preview), save the file and open it in Chrome, Safari, Edge or Firefox.';
    document.getElementById('map').appendChild(m);
  }, 7000);

  var track = JSON.parse(document.getElementById('track').textContent);
  L.polyline(track,{color:'#1E2A32',weight:7,opacity:.75,interactive:false}).addTo(map);
  L.polyline(track,{color:'#FFFFFF',weight:3,opacity:1,interactive:false}).addTo(map);

  function popup(x, isBackup){
    var s = st(x.status);
    var h = '<div class="pp"><h3>'+esc(x.name)+'</h3>';
    h += (hasStatus?'<span class="pill" style="background:'+s.hex+'">'+s.label+'</span>':'')+'<dl>';
    if (!isBackup) h += '<dt>Night</dt><dd>'+x.night+' · '+esc(x.date)+' 2027</dd>';
    else h += '<dt>Backup for</dt><dd>Night '+x.for+'</dd>';
    if (x.alt) h += '<dt>Altitude</dt><dd>'+x.alt.toLocaleString()+' m</dd>';
    if (x.next_walk) h += '<dt>Next day</dt><dd>'+walk(x.next_walk)+'</dd>';
    if (x.approx) h += '<dt>Position</dt><dd>Approximate</dd>';
    h += '</dl>'+(hasStatus?'<p style="margin:8px 0 0">Availability and how to book are in the daily email.</p>':'')+'</div>';
    return h;
  }

  var markers = {};
  D.nights.forEach(function(x){
    var icon = L.divIcon({className:'',html:'<div class="mk" style="background:'+st(x.status).hex+'">'+x.night+'</div>',iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-16]});
    markers[x.night] = L.marker([x.lat,x.lon],{icon:icon,title:x.name,zIndexOffset:1000}).addTo(map).bindPopup(popup(x,false),{maxWidth:300});
  });
  Object.keys(D.backups).forEach(function(k){
    var b = D.backups[k];
    var icon = L.divIcon({className:'',html:'<div class="mk alt" style="border-color:'+st(b.status).hex+'"></div>',iconSize:[18,18],iconAnchor:[9,9],popupAnchor:[0,-8]});
    markers[k] = L.marker([b.lat,b.lon],{icon:icon,title:b.name+' (backup)'}).addTo(map).bindPopup(popup(b,true),{maxWidth:300});
  });
  var ex = L.divIcon({className:'',html:'<div class="mk" style="background:#5B6770">&#x2691;</div>',iconSize:[34,34],iconAnchor:[17,17]});
  L.marker([D.exit.lat,D.exit.lon],{icon:ex,title:D.exit.name}).addTo(map).bindPopup('<div class="pp"><h3>'+esc(D.exit.name)+'</h3>'+esc(D.exit.date)+' 2027. '+esc(D.exit.note)+'</div>');
  map.fitBounds(L.latLngBounds(track).pad(0.06));

  // list
  var ol = document.getElementById('list');
  D.nights.forEach(function(x, i){
    var s = st(x.status);
    var nextN = D.nights[i+1];
    var bk = (x.backups||[]).map(function(k){return D.backups[k]&&D.backups[k].name;}).filter(Boolean);
    var li = document.createElement('li');
    li.style.borderLeftColor = nextN ? st(nextN.status).hex : '#5B6770';
    li.innerHTML = '<span class="num" style="background:'+s.hex+'">'+x.night+'</span>'+
      '<button class="row" type="button"><div class="date">'+esc(x.date)+'</div>'+
      '<div class="hut">'+esc(x.name)+(hasStatus?' <span class="pill" style="background:'+s.hex+'">'+s.label+'</span>':'')+'</div>'+
      (x.next_walk?'<div class="meta">Next day: '+walk(x.next_walk)+'</div>':'')+
      (bk.length?'<div class="meta">Backups: '+esc(bk.join(', '))+'</div>':'')+'</button>';
    li.querySelector('button').addEventListener('click',function(){
      document.getElementById('map').scrollIntoView({behavior:'smooth',block:'center'});
      map.flyTo([x.lat,x.lon],13,{duration:.8});
      setTimeout(function(){markers[x.night].openPopup();},850);
    });
    ol.appendChild(li);
  });
  var li = document.createElement('li'); li.className='exit';
  li.innerHTML = '<span class="num">&#x2691;</span><div class="row" style="cursor:default"><div class="date">'+esc(D.exit.date)+'</div><div class="hut">'+esc(D.exit.name)+'</div><div>'+esc(D.exit.note)+'</div></div>';
  ol.appendChild(li);
})();
</script>
</body>
</html>
